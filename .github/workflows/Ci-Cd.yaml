# El pipeline se activará automáticamente cada vez que hagas un push a la rama main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub nos presta una máquina Linux virtual para correr este proceso

    steps:
    - name: 1. Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: 2. Iniciar sesión en Docker Hub de forma segura
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 3. Construir la imagen de Docker y subirla (Push)
      uses: docker/build-push-action@v5
      with:
        context: ./app  # Le indica a GitHub que el Dockerfile está dentro de la carpeta app
        push: true
        # Reemplaza las credenciales por variables de entorno para que no se vean en el código
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/monitor-app:latest, ${{ secrets.DOCKERHUB_USERNAME }}/monitor-app:v1
